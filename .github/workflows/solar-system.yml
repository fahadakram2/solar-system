name: Solar System

on:
    push:
        branches:
            - main
            - 'feature/*'
    workflow_dispatch:

env:
    MONGO_URI: mongodb+srv://${{ vars.MONGO_USERNAME }}:${{ secrets.MONGO_PASSWORD }}@supercluster.d83jj.mongodb.net/superData

jobs:
    unit-testing:
        strategy:
            matrix:
                os: [ubuntu-latest, macos-latest]
                node-version: [18, 19, 20]
                exclude:
                    - os: macos-latest
                      node-version: 18
        runs-on: ${{ matrix.os }}
        steps:
          - name: Checkout Code
            uses: actions/checkout@v4
            
          - name: Install Node
            uses: actions/setup-node@v4
            with:
                node_version: ${{ matrix.node-version }}
            
          - name: Install Dependencies
            run: npm install

          - name: Unit Testing
            run: npm test

          - name: Archieve Tests
            uses: actions/upload-artifact@v4
            with:
                name: Mocha-test-result
                path: test-results.xml
