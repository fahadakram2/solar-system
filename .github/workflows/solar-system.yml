name: Solar System

on:
    push:
        branches:
            - main
            - 'feature/*'
    workflow_dispatch:

env:
    MONGO_URI: mongodb+srv://${{ vars.MONGO_USERNAME }}:${{ secrets.MONGO_PASSWORD }}@supercluster.d83jj.mongodb.net/superData

jobs:
    unit-testing:
        strategy:
            matrix:
                os: [ubuntu-latest]
                node-version: [18, 19, 20]
                exclude:
                    - os: macos-latest
                      node-version: 18
        runs-on: ${{ matrix.os }}
        steps:
          - name: Checkout Code
            uses: actions/checkout@v4
            
          - name: Install Node ${{ matrix.node-version }}
            uses: actions/setup-node@v4
            with:
                node_version: ${{ matrix.node-version }}

          - name: Cache Dependency
            uses: actions/cache@v4
            with:
              path: node_modules
              key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
            
          - name: Install Dependencies
            run: npm install

          - name: Unit Testing
            run: npm test

          - name: Archieve Tests
            uses: actions/upload-artifact@v4
            with:
                name: Mocha-test-result-${{ matrix.os }}-${{ matrix.node-version }}
                path: test-results.xml
               


    Coverage:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout code
            uses: actions/checkout@v4
            
          - name: Setup Node
            uses: actions/setup-node@v4
            with:
                node_version: 18

          - name: Cache Dependency
            uses: actions/cache@v3
            with:
              path: node_modules
              key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json')}}


          - name: Install Dependency
            run: npm install

          - name: Check code coverage
            run: npm run coverage
            continue-on-error: true

          - name: Archieve Test results
            uses: actions/upload-artifact@v4
            with:
                name: Code-Coverage-Result
                path: coverage
                retention-days: 10

    Containerization:
      runs-on: ubuntu-latest
      needs: [unit-testing, Coverage]
      steps:
        - name: Login to Docker
          uses: docker/login-action@v4
          with:
            username: ${{ vars.DOCKER_USER }}
            password: ${{ secrets.DOCKER_PASS }}
            
