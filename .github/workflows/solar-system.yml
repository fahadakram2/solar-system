name: Solar System

on:
    push:
        branches:
            - main
            - 'feature/*'
    workflow_dispatch:

env:
    MONGO_URI: mongodb+srv://${{ vars.MONGO_USERNAME }}:${{ secrets.MONGO_PASSWORD }}@supercluster.d83jj.mongodb.net/superData

jobs:
    unit-testing:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout Code
            uses: actions/checkout@v4
            
          - name: Install Node
            uses: actions/setup-node@v4
            with:
                node_version: '16'
            
          - name: Install Dependencies
            run: npm install

          - name: Unit Testing
            run: npm test

          - name: Archieve Tests
            uses: actions/upload-artifact@v4
            with:
                name: Mocha-test-result
                path: test-results.xml
